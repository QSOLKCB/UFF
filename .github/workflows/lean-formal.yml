name: UFF Lean 4 formal verification

on:
  push:
    branches:
      - agent/v5.2.0-lean-formal-assurance
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    branches:
      - main
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_VERSION: "4.33.0"
  LEAN_LINUX_SHA256: "4b3fb03c29a1e0a253fb1d11f9bae3725f19a0dc6fc09b3ea16d2c9df3349e2c"
  UFF_V5_1_BASE_COMMIT: "136b63089f5b70cd2a7356b6f647d482f3b3273c"
  UFF_FORMALIZATION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify v5.1.0 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${UFF_V5_1_BASE_COMMIT}^{commit}"
          git cat-file -e "${UFF_FORMALIZATION_COMMIT}^{commit}"
          git merge-base --is-ancestor "$UFF_V5_1_BASE_COMMIT" "$UFF_FORMALIZATION_COMMIT"
          test "$(git merge-base "$UFF_V5_1_BASE_COMMIT" "$UFF_FORMALIZATION_COMMIT")" = "$UFF_V5_1_BASE_COMMIT"
          echo "v5.1.0 base: ${UFF_V5_1_BASE_COMMIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "v5.2.0 formalization head: ${UFF_FORMALIZATION_COMMIT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Early proof-hole and assumption scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formal/lean/UFF --include='*.lean'; then
            echo 'Lean formalization contains a forbidden proof hole.' >&2
            exit 1
          fi
          if grep -R -nE '^[[:space:]]*(axiom|constant)[[:space:]]' formal/lean/UFF --include='*.lean'; then
            echo 'Lean formalization contains a project-defined axiom/constant declaration.' >&2
            exit 1
          fi

      - name: Install pinned official Lean release
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/lean-${LEAN_VERSION}-linux.tar.zst"
          dist="/tmp/uff-lean-dist"
          curl -fsSL --retry 5 --retry-delay 2 \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst" \
            -o "$archive"
          printf '%s  %s\n' "$LEAN_LINUX_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$dist"
          tar --zstd -xf "$archive" -C "$dist"
          printf '%s\n' "$dist/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"

      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          test "$(cat formal/lean/lean-toolchain)" = "leanprover/lean4:v${LEAN_VERSION}"

      - name: Run complete declaration and axiom audit
        shell: bash
        working-directory: formal/lean
        run: |
          set -euo pipefail
          bash audit.sh formal-verification-report.txt

      - name: Publish formal verification report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f formal/lean/formal-verification-report.txt ]]; then
            {
              echo '```text'
              cat formal/lean/formal-verification-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
