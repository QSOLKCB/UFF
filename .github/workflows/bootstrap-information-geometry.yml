name: Bootstrap UFF Information Geometry

on:
  push:
    branches:
      - feat/information-geometry-nexus-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bootstrap-information-geometry-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  unpack-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/information-geometry-nexus-v2

      - name: Validate split payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json

          root = Path.cwd().resolve()
          parts = sorted((root / '.bootstrap' / 'parts').glob('part-*.b64'))
          expected_blob_shas = [
              '35512f79880a58fc897df09fe96a52b7deaa88b6',
              '742d7fbe44c8a9e332dd5e3b63b5ba79f5aa73b3',
              'a1204136231c36b2068d7dcb189cc0b46e1c1725',
              'dfa27543a111c819ef6fe47e3a8a1e0808d5ddb0',
              '16ca424215ee2373a341509861356e40ef2b09ab',
              'dd5a78a8e0cbab9149b41c17d0b8eb9b11adc857',
              'd30655146032ce73b977351dd3017c13de226d02',
              'c62b09c70d9663c9f646807f709a187a5e7f6ea3',
              'd8544240d7ca62c65e9c008d81ee4986de8857d5',
              '5f781be440e5660af1d9132da662af46ef05f89b',
              'a726f3c6fdb0ccd9ef5b9e4e65cb69d590d4399c',
              '990b1d2aed5ad773f14668e998883d482289a70e',
              '68b888fa731f8600062ce4801d5b32c6dbf83516',
              '9645f42095f88ff2d19d7ffa237409cde03dc58e',
              'ab1489abede2ad0f4d0941ca05443f22b7acc5bf',
              '515ffaa7821872a9dbac9424e6aee17b6cc7f499',
              'a4e786da411758fee0126f0d1c55e889847312ad',
              '3cb627674cd9e3c66504f6bc4127e48a0560d80e',
              '90ac71eee4896e6e632fe27eeb23e58aa00495fc',
              '9dc7da61cdc7ce8804547531575886d08dcbf591',
              '7b2255274e4d44e9e318019f83189e2faf2ee846',
              '262d28197d0e2498f3ffbe955b1ec6447d12a59e',
              '9eef3b0e3e4da0974de0ffbea157ccc5dd90f322',
              'eb4089d81a5dc8b58fff6713fe6091d790e1da89',
              '9747be4092727645497ca83ba9edece1214ab31d',
              'bb4ad019761e0f17dacad091cfcb9aa31c9d8260',
              'aeb2c960262b4eb6437df291219aa1a8c58f4d22',
              '17b1c4a2071072d70fcc1316387d84a95824b64d',
          ]
          report = {
              'part_count': len(parts),
              'expected_part_count': 28,
              'parts': [],
          }
          for index, path in enumerate(parts):
              data = path.read_bytes()
              blob_sha = hashlib.sha1(
                  f'blob {len(data)}\0'.encode() + data
              ).hexdigest()
              expected = expected_blob_shas[index] if index < len(expected_blob_shas) else None
              report['parts'].append({
                  'path': path.name,
                  'length': len(data),
                  'blob_sha': blob_sha,
                  'expected_blob_sha': expected,
                  'matches': blob_sha == expected,
              })
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          report['encoded_length'] = len(encoded)
          try:
              archive_bytes = base64.b64decode(encoded, validate=True)
              report['base64_valid'] = True
              report['archive_length'] = len(archive_bytes)
              report['archive_sha256'] = hashlib.sha256(archive_bytes).hexdigest()
              report['expected_archive_sha256'] = '1fc3bf8306a41094323cf22d60eda56e3700f743ad0627ada6fa91072d3d1d8b'
              report['archive_matches'] = report['archive_sha256'] == report['expected_archive_sha256']
          except Exception as exc:
              report['base64_valid'] = False
              report['error'] = repr(exc)
          (root / '.bootstrap' / 'payload-validation.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit payload validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bootstrap/payload-validation.json
          git commit -m "chore: record payload validation" || true
          git push origin HEAD:feat/information-geometry-nexus-v2

      - name: Reassemble and unpack validated payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          parts = sorted((root / '.bootstrap' / 'parts').glob('part-*.b64'))
          if len(parts) != 28:
              raise SystemExit(f'expected 28 payload parts, found {len(parts)}')

          encoded = ''.join(
              path.read_text(encoding='ascii').strip()
              for path in parts
          )
          archive = root / '.bootstrap' / 'UFF_ig_nexus_repo_payload.zip'
          archive.write_bytes(base64.b64decode(encoded, validate=True))

          with ZipFile(archive) as bundle:
              for info in bundle.infolist():
                  relative = Path(info.filename)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
                  destination = (root / relative).resolve()
                  if root not in destination.parents and destination != root:
                      raise SystemExit(
                          f'archive path escapes repository: {info.filename}'
                      )
              bundle.extractall(root)
          PY

      - name: Integrate README launch panel
        run: python scripts/apply_information_geometry_patch.py

      - name: Remove bootstrap machinery
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-information-geometry.yml

      - name: Commit expanded laboratory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add NEXUS-backed information geometry laboratory"
          git push origin HEAD:feat/information-geometry-nexus-v2
