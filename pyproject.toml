[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsol-uff"
version = "5.0.0"
description = "Reproducible astrophysics, celestial-node falsification, and survey-aware audit laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Trent Slade"},
]
keywords = [
  "galaxy rotation curves",
  "SPARC",
  "MOND",
  "NFW",
  "Burkert",
  "supermassive black holes",
  "loop quantum gravity",
  "preregistration",
  "survey systematics",
  "spherical statistics",
  "falsification",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
uff = "uff.cli:main"

[project.urls]
Homepage = "https://github.com/QSOLKCB/UFF"
Repository = "https://github.com/QSOLKCB/UFF"
Documentation = "https://github.com/QSOLKCB/UFF/tree/main/docs"
Changelog = "https://github.com/QSOLKCB/UFF/blob/main/CHANGELOG.md"
Issues = "https://github.com/QSOLKCB/UFF/issues"

[tool.setuptools]
packages = ["uff"]
py-modules = ["uff_model", "e8_visualization"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["uff"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
